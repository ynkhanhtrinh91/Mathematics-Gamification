<!-- PHẦN GIÁO VIÊN DUYỆT SỬ DỤNG THẺ ĐÃ ĐƯỢC TỐI ƯU GIAO DIỆN -->
<div id="teacher-card-control" class="teacher-card-panel hidden">
    <h4 class="sub-title"><i class="fas fa-user-check"></i> Giáo Viên Duyệt Sử Dụng Thẻ</h4>
    <div class="card-use-btns">
        <button onclick="useCard('hintCard', -1, 'Dùng 1 Thẻ Gợi Ý Bài Khó')" class="btn-use-card hint-btn">
            <i class="fas fa-lightbulb"></i>
            <span>Dùng 1 Thẻ Gợi Ý</span>
            <span class="badge">-1</span>
        </button>
        <button onclick="useCard('homeworkCard', -1, 'Dùng 1 Thẻ Miễn BTVN')" class="btn-use-card homework-btn">
            <i class="fas fa-file-signature"></i>
            <span>Dùng 1 Thẻ Miễn BTVN</span>
            <span class="badge">-1</span>
        </button>
    </div>
</div>
